<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bug Tracker - AInode QA</title>
  <meta name="description" content="Live bug tracking integrated with Google Sheets." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      --surface:   rgba(255, 255, 255, 0.7);
      --border:    rgba(2, 132, 199, 0.12);
      --text:      #0f172a;   /* slate-900 */
      --muted:     #475569;   /* slate-600 */
      --accent:    #e11d48;   /* rose-600 */
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* ── background decorative orbs ── */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      z-index: -1;
      pointer-events: none;
      animation: float 20s ease-in-out infinite alternate;
    }
    .orb-1 {
      top: -100px;
      left: 10%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #38bdf8 0%, rgba(56,189,248,0) 70%);
    }
    .orb-2 {
      bottom: 10%;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #06b6d4 0%, rgba(6,182,212,0) 70%);
      animation-delay: -5s;
    }
    .orb-3 {
      top: 40%;
      left: -150px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #818cf8 0%, rgba(129,140,248,0) 70%);
      animation-delay: -10s;
    }
    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(30px) scale(1.05); }
    }

    /* ── top header ── */
    header {
      width: 100%;
      padding: 48px 24px 32px;
      text-align: center;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(225,29,72,0.06) 0%, transparent 70%);
      position: relative;
    }
    
    .nav-back {
      position: absolute;
      top: 48px;
      left: 48px;
      color: #0284c7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .nav-back:hover {
      color: #0369a1;
    }
    
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(225, 29, 72, 0.08);
      border: 1px solid rgba(225, 29, 72, 0.2);
      border-radius: 99px;
      padding: 4px 14px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.05);
    }
    header h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      background: linear-gradient(135deg, #0f172a 0%, #e11d48 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.15;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }
    header p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── Main content ── */
    main {
      width: 100%;
      max-width: 1060px;
      padding: 16px 24px 64px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      z-index: 2;
    }

    /* ── Summary Stats ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    
    .stat-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }
    .stat-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
    }

    /* ── Table Container ── */
    .table-container {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow-x: auto;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    
    thead {
      background: rgba(15, 23, 42, 0.02);
      border-bottom: 1px solid var(--border);
    }
    
    th {
      padding: 14px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    
    td {
      padding: 14px 16px;
      font-size: 14px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.05);
      color: var(--text);
    }
    
    tr:last-child td {
      border-bottom: none;
    }
    
    /* ── Badges ── */
    .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-open { background: rgba(225, 29, 72, 0.1); color: #e11d48; border: 1px solid rgba(225, 29, 72, 0.2); }
    .status-inprogress { background: rgba(217, 119, 6, 0.1); color: #d97706; border: 1px solid rgba(217, 119, 6, 0.2); }
    .status-resolved { background: rgba(13, 148, 136, 0.1); color: #0d9488; border: 1px solid rgba(13, 148, 136, 0.2); }
    
    .priority-high { color: #e11d48; font-weight: 600; }
    .priority-medium { color: #d97706; font-weight: 600; }
    .priority-low { color: #0d9488; font-weight: 600; }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px dashed var(--border);
      border-radius: 16px;
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.8;
    }
    .empty-state h3 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--text);
    }
    .empty-state p {
      color: var(--muted);
      margin-bottom: 24px;
    }

    /* ── footer ── */
    footer {
      width: 100%;
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: auto;
      z-index: 2;
    }
    footer a { color: var(--accent); font-weight: 600; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Section Title and Separators ── */
    .section-separator {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }
    
    .section-header {
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      padding-left: 14px;
      line-height: 1.2;
    }
    
    .section-title::before {
      content: '';
      position: absolute;
      left: 0;
      top: 2px;
      bottom: 2px;
      width: 4px;
      background: var(--accent);
      border-radius: 2px;
    }

    .section-desc {
      color: var(--muted);
      font-size: 0.95rem;
      margin-left: 14px;
      margin-top: 4px;
    }

    /* ── Charts Grid ── */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 24px;
      margin-bottom: 24px;
    }
    
    @media (max-width: 950px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
    }

    .chart-header {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      padding: 14px 20px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      color: #fff;
      text-transform: uppercase;
    }

    .chart-body {
      padding: 24px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Mobile responsiveness ── */
    @media (max-width: 600px) {
      header { padding: 48px 16px 24px; }
      .nav-back { top: 16px; left: 16px; }
      main { padding: 16px; gap: 24px; }
      .stat-card { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- Floating Creative Background Orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>

  <header>
    <a href="index.html" class="nav-back">← Back to Dashboard</a>
    <div class="badge">Live Tracker</div>
    <h1>Bug Summary</h1>
    <p>Live sync from Google Sheets. Keep track of open issues, priority, and resolutions across the AiNode platform.</p>
  </header>

  <main>
    <div id="summary-container" class="summary-grid">
      <!-- Stats injected here -->
    </div>

    <div id="bugs-container">
      <!-- Table or empty state injected here -->
    </div>
  </main>

  <footer>
    <p>
      AiNode Bug Tracker · 
      Powered by Google Sheets API & PapaParse ·
      <a href="index.html">Dashboard</a>
    </p>
  </footer>

  <script>
    // =====================================================================================
    // SETUP INSTRUCTIONS:
    // 1. Create a Google Sheet with headers: ID, Title, Status, Priority, Date, Reporter
    // 2. Go to File -> Share -> Publish to web
    // 3. Select your sheet, choose "Comma-separated values (.csv)", click Publish
    // 4. Copy the link and paste it inside the quotes below!
    // =====================================================================================
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTHpTmrqrkcM9p_VUlrC09LGA7K-4ET4cC6JAgp7cr0lxs-5nwXx9PXslfD4Php9LLpMibuMMZeMMxa/pub?gid=0&single=true&output=csv"; 

    document.addEventListener("DOMContentLoaded", loadBugs);

    function loadBugs() {
      const container = document.getElementById('bugs-container');
      const summary = document.getElementById('summary-container');
      
      if (!SHEET_CSV_URL) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔗</div>
            <h3>No Google Sheet Connected</h3>
            <p>To view your live bugs here, follow these simple steps:</p>
            <div style="background:rgba(15, 23, 42, 0.04); border-radius:12px; padding:24px; text-align:left; display:inline-block; max-width:600px; margin: 0 auto; border: 1px solid rgba(15, 23, 42, 0.08);">
              <ol style="color:var(--text); font-size:14px; line-height:1.8; margin-left: 20px;">
                <li>Create a Google Sheet with columns exactly named: <strong>Services (GUI), # P0 Count, # P1 Count, # P2 Count, Total</strong></li>
                <li>Go to <strong>File &gt; Share &gt; Publish to web</strong></li>
                <li>Select the sheet and choose <strong>Comma-separated values (.csv)</strong></li>
                <li>Click Publish and copy the link</li>
                <li>Open <code>bugs.html</code> in your code editor and paste the link into the <code>SHEET_CSV_URL</code> variable on line 263.</li>
                <li>Commit and push the changes to GitHub!</li>
              </ol>
            </div>
          </div>`;
        return;
      }

      // Show loading
      container.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--muted);">Loading bugs from Google Sheets...</div>`;

      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: false,
        skipEmptyLines: 'greedy',
        complete: function(results) {
          if (results.errors && results.errors.length > 0 && results.data.length === 0) {
            container.innerHTML = `<div class="empty-state"><h3>Error loading CSV</h3><p>${results.errors[0].message}</p></div>`;
            return;
          }
          
          const rows = results.data;
          let table1Rows = [];
          let table2Rows = [];
          let currentTable = 0; // 0: none, 1: Services, 2: Reporters
          
          rows.forEach(row => {
            const cells = row.map(cell => (cell || '').trim());
            if (cells.length === 0 || cells.every(c => c === '')) {
              return;
            }
            
            const firstCell = cells[0].toLowerCase();
            if (firstCell.includes('services (gui)')) {
              currentTable = 1;
              return;
            } else if (firstCell === 'name') {
              currentTable = 2;
              return;
            }
            
            if (currentTable === 1) {
              table1Rows.push(cells);
            } else if (currentTable === 2) {
              table2Rows.push(cells);
            }
          });
          
          renderBugs(table1Rows, table2Rows);
        },
        error: function(err) {
          container.innerHTML = `<div class="empty-state"><h3>Failed to fetch data</h3><p>${err.message}</p></div>`;
        }
      });
    }

    function renderBugs(table1Rows, table2Rows) {
      const container = document.getElementById('bugs-container');
      const summary = document.getElementById('summary-container');

      if ((!table1Rows || table1Rows.length === 0) && (!table2Rows || table2Rows.length === 0)) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🎉</div>
            <h3>No Data Found!</h3>
            <p>The connected Google Sheet is empty.</p>
          </div>`;
        return;
      }

      // Filter out total rows to do our own clean calculations
      const services = table1Rows.filter(row => row[0] && row[0].toLowerCase() !== 'total');
      const reporters = table2Rows.filter(row => row[0] && row[0].toLowerCase() !== 'total');

      // Calculate stats (only based on services to avoid double counting)
      let totalP0 = 0;
      let totalP1 = 0;
      let totalP2 = 0;
      let grandTotal = 0;
      
      services.forEach(row => {
        const p0 = parseInt(row[1] || 0, 10) || 0;
        const p1 = parseInt(row[2] || 0, 10) || 0;
        const p2 = parseInt(row[3] || 0, 10) || 0;
        const total = parseInt(row[4] || 0, 10) || 0;
        
        totalP0 += p0;
        totalP1 += p1;
        totalP2 += p2;
        grandTotal += total;
      });

      // Render summary
      summary.innerHTML = `
        <div class="stat-card">
          <div class="stat-title" style="color:#e11d48;">Total P0 Issues</div>
          <div class="stat-value" style="color:#e11d48;">${totalP0}</div>
        </div>
        <div class="stat-card">
          <div class="stat-title" style="color:#d97706;">Total P1 Issues</div>
          <div class="stat-value" style="color:#d97706;">${totalP1}</div>
        </div>
        <div class="stat-card">
          <div class="stat-title" style="color:#0284c7;">Total P2 Issues</div>
          <div class="stat-value" style="color:#0284c7;">${totalP2}</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Grand Total</div>
          <div class="stat-value">${grandTotal}</div>
        </div>
      `;

      let html = '';

      // ================= SECTION 1: SERVICES =================
      html += `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">Bugs by Service (GUI)</h2>
            <p class="section-desc">Distribution of issues across different platform services and functional areas.</p>
          </div>
          
          <div class="charts-grid">
            <!-- Priority Doughnut Chart -->
            <div class="chart-card">
              <div class="chart-header">Bugs By Priority</div>
              <div class="chart-body" style="flex-direction: row; flex-wrap: wrap; gap: 24px; justify-content: space-around;">
                <div style="position: relative; width: 220px; height: 220px;">
                  <canvas id="priorityChart"></canvas>
                  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;">
                    <div style="font-size: 28px; font-weight: 800; color: #0f172a; line-height: 1;">${grandTotal}</div>
                    <div style="font-size: 11px; font-weight: 600; color: #475569; margin-top: 2px;">Total Bugs</div>
                  </div>
                </div>
                <!-- Custom Legend -->
                <div style="flex: 1; min-width: 180px; max-width: 240px;">
                  <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                    <tbody>
                      <tr style="border-bottom: 1px solid rgba(15,23,42,0.06);">
                        <td style="padding: 8px 4px; display: flex; align-items: center; gap: 8px;">
                          <span style="width: 10px; height: 10px; border-radius: 50%; background: #e11d48;"></span>
                          <span style="color: #0f172a; font-weight: 500;">P0 (Critical)</span>
                        </td>
                        <td style="padding: 8px 4px; text-align: right; font-weight: 700; color: #0f172a;">${totalP0}</td>
                        <td style="padding: 8px 4px; text-align: right; color: #475569;">${grandTotal > 0 ? (totalP0/grandTotal*100).toFixed(1) : 0}%</td>
                      </tr>
                      <tr style="border-bottom: 1px solid rgba(15,23,42,0.06);">
                        <td style="padding: 8px 4px; display: flex; align-items: center; gap: 8px;">
                          <span style="width: 10px; height: 10px; border-radius: 50%; background: #d97706;"></span>
                          <span style="color: #0f172a; font-weight: 500;">P1 (High)</span>
                        </td>
                        <td style="padding: 8px 4px; text-align: right; font-weight: 700; color: #0f172a;">${totalP1}</td>
                        <td style="padding: 8px 4px; text-align: right; color: #475569;">${grandTotal > 0 ? (totalP1/grandTotal*100).toFixed(1) : 0}%</td>
                      </tr>
                      <tr style="border-bottom: 1px solid rgba(15,23,42,0.06);">
                        <td style="padding: 8px 4px; display: flex; align-items: center; gap: 8px;">
                          <span style="width: 10px; height: 10px; border-radius: 50%; background: #0284c7;"></span>
                          <span style="color: #0f172a; font-weight: 500;">P2 (Medium)</span>
                        </td>
                        <td style="padding: 8px 4px; text-align: right; font-weight: 700; color: #0f172a;">${totalP2}</td>
                        <td style="padding: 8px 4px; text-align: right; color: #475569;">${grandTotal > 0 ? (totalP2/grandTotal*100).toFixed(1) : 0}%</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            
            <!-- Top 5 Services Chart -->
            <div class="chart-card">
              <div class="chart-header">Top 5 Services by Total Bugs</div>
              <div class="chart-body" style="position: relative; height: 260px;">
                <canvas id="servicesChart"></canvas>
              </div>
            </div>
          </div>

          <!-- Services Table -->
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Service (GUI)</th>
                  <th style="text-align:center;">P0 Count</th>
                  <th style="text-align:center;">P1 Count</th>
                  <th style="text-align:center;">P2 Count</th>
                  <th style="text-align:center;">Total</th>
                </tr>
              </thead>
              <tbody>
      `;

      services.forEach(row => {
        const service = row[0] || '-';
        const p0 = parseInt(row[1] || 0, 10) || 0;
        const p1 = parseInt(row[2] || 0, 10) || 0;
        const p2 = parseInt(row[3] || 0, 10) || 0;
        const total = parseInt(row[4] || 0, 10) || 0;

        const p0Display = p0 > 0 ? `<span style="color:#e11d48; font-weight:700;">${p0}</span>` : `<span style="color:#94a3b8;">${p0}</span>`;
        const p1Display = p1 > 0 ? `<span style="color:#d97706; font-weight:700;">${p1}</span>` : `<span style="color:#94a3b8;">${p1}</span>`;
        const p2Display = p2 > 0 ? `<span style="color:#0284c7; font-weight:700;">${p2}</span>` : `<span style="color:#94a3b8;">${p2}</span>`;
        const totalDisplay = total > 0 ? `<span style="color:#0f172a; font-weight:800;">${total}</span>` : `<span style="color:#94a3b8;">${total}</span>`;

        html += `
          <tr>
            <td style="color:#0f172a; font-weight:600;">${service}</td>
            <td style="text-align:center;">${p0Display}</td>
            <td style="text-align:center;">${p1Display}</td>
            <td style="text-align:center;">${p2Display}</td>
            <td style="text-align:center; background:rgba(15,23,42,0.02);">${totalDisplay}</td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      // ================= SECTION SEPARATOR =================
      html += `<div class="section-separator"></div>`;

      // ================= SECTION 2: DEVELOPERS =================
      html += `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">Bugs by Developer</h2>
            <p class="section-desc">Bug counts assigned to each developer for resolution.</p>
          </div>
          
          <div class="charts-grid">
            <!-- Bugs by Developer bar chart -->
            <div class="chart-card" style="grid-column: 1 / -1;">
              <div class="chart-header">Bugs Breakdown by Developer</div>
              <div class="chart-body" style="position: relative; height: 280px; padding: 24px 32px 16px 24px;">
                <canvas id="reporterChart"></canvas>
              </div>
            </div>
          </div>

          <!-- Bugs by Developer Table -->
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Developer</th>
                  <th style="text-align:center;">P0 Count</th>
                  <th style="text-align:center;">P1 Count</th>
                  <th style="text-align:center;">P2 Count</th>
                  <th style="text-align:center;">Total</th>
                </tr>
              </thead>
              <tbody>
      `;

      reporters.forEach(row => {
        const name = row[0] || '-';
        const p0 = parseInt(row[1] || 0, 10) || 0;
        const p1 = parseInt(row[2] || 0, 10) || 0;
        const p2 = parseInt(row[3] || 0, 10) || 0;
        const total = parseInt(row[4] || 0, 10) || 0;

        const p0Display = p0 > 0 ? `<span style="color:#e11d48; font-weight:700;">${p0}</span>` : `<span style="color:#94a3b8;">${p0}</span>`;
        const p1Display = p1 > 0 ? `<span style="color:#d97706; font-weight:700;">${p1}</span>` : `<span style="color:#94a3b8;">${p1}</span>`;
        const p2Display = p2 > 0 ? `<span style="color:#0284c7; font-weight:700;">${p2}</span>` : `<span style="color:#94a3b8;">${p2}</span>`;
        const totalDisplay = total > 0 ? `<span style="color:#0f172a; font-weight:800;">${total}</span>` : `<span style="color:#94a3b8;">${total}</span>`;

        html += `
          <tr>
            <td style="color:#0f172a; font-weight:600;">${name}</td>
            <td style="text-align:center;">${p0Display}</td>
            <td style="text-align:center;">${p1Display}</td>
            <td style="text-align:center;">${p2Display}</td>
            <td style="text-align:center; background:rgba(15,23,42,0.02);">${totalDisplay}</td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
        </div>
      `;

      container.innerHTML = html;

      if (window.ChartDataLabels) {
        Chart.register(window.ChartDataLabels);
      }

      // 1. Draw Priority Doughnut Chart
      const ctxPriority = document.getElementById('priorityChart').getContext('2d');
      new Chart(ctxPriority, {
        type: 'doughnut',
        data: {
          labels: ['P0 (Critical)', 'P1 (High)', 'P2 (Medium)'],
          datasets: [{
            data: [totalP0, totalP1, totalP2],
            backgroundColor: ['#e11d48', '#d97706', '#0284c7'],
            borderWidth: 2,
            borderColor: '#ffffff',
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '65%',
          plugins: {
            legend: { display: false },
            tooltip: { enabled: true },
            datalabels: {
              color: '#ffffff',
              font: { weight: 'bold', size: 12, family: 'Inter' },
              formatter: (value, ctx) => {
                if (value === 0) return null;
                return value;
              },
              textAlign: 'center'
            }
          }
        }
      });

      // 2. Prepare data for Top 5 Services
      const servicesData = [];
      services.forEach(row => {
        const service = row[0] || '';
        if (!service) return;
        const total = parseInt(row[4] || 0, 10) || 0;
        servicesData.push({ service, total });
      });
      servicesData.sort((a, b) => b.total - a.total);
      const top5 = servicesData.slice(0, 5);
      
      const barColors = ['#4f46e5', '#d97706', '#8b5cf6', '#0d9488', '#0284c7'];

      // Draw Top 5 Services Bar Chart
      const ctxServices = document.getElementById('servicesChart').getContext('2d');
      new Chart(ctxServices, {
        type: 'bar',
        data: {
          labels: top5.map(item => item.service),
          datasets: [{
            data: top5.map(item => item.total),
            backgroundColor: barColors.slice(0, top5.length),
            borderRadius: 6,
            borderSkipped: false,
            barPercentage: 0.6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { 
              beginAtZero: true, 
              grace: '15%',
              title: { display: true, text: 'Total Bugs', color: '#475569', font: { family: 'Inter', weight: '600', size: 11 } },
              grid: { color: 'rgba(15, 23, 42, 0.05)' }, 
              ticks: { color: '#475569', precision: 0 } 
            },
            x: { 
              grid: { display: false }, 
              ticks: { color: '#475569', font: { family: 'Inter', size: 10, weight: '500' } } 
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: true },
            datalabels: {
              anchor: 'end',
              align: 'end',
              offset: 2,
              color: '#0f172a',
              font: { weight: 'bold', size: 11, family: 'Inter' },
              formatter: (value) => value
            }
          },
          layout: {
            padding: { top: 20 }
          }
        }
      });

      // 3. Draw Grouped Vertical Bar Chart for Developers
      const reporterLabels = [];
      const reporterP0s = [];
      const reporterP1s = [];
      const reporterP2s = [];

      reporters.forEach(row => {
        const name = row[0];
        if (!name) return;
        const p0 = parseInt(row[1] || 0, 10) || 0;
        const p1 = parseInt(row[2] || 0, 10) || 0;
        const p2 = parseInt(row[3] || 0, 10) || 0;
        
        reporterLabels.push(name);
        reporterP0s.push(p0);
        reporterP1s.push(p1);
        reporterP2s.push(p2);
      });

      const ctxReporter = document.getElementById('reporterChart').getContext('2d');
      new Chart(ctxReporter, {
        type: 'bar',
        data: {
          labels: reporterLabels,
          datasets: [
            {
              label: 'P0 (Critical)',
              data: reporterP0s,
              backgroundColor: '#e11d48',
              borderRadius: 4
            },
            {
              label: 'P1 (High)',
              data: reporterP1s,
              backgroundColor: '#d97706',
              borderRadius: 4
            },
            {
              label: 'P2 (Medium)',
              data: reporterP2s,
              backgroundColor: '#0284c7',
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              grace: '15%',
              title: { display: true, text: 'Bugs Count', color: '#475569', font: { family: 'Inter', weight: '600', size: 11 } },
              grid: { color: 'rgba(15, 23, 42, 0.05)' },
              ticks: { color: '#475569', precision: 0 }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#0f172a', font: { family: 'Inter', size: 12, weight: '600' } }
            }
          },
          plugins: {
            legend: {
              display: true,
              position: 'top',
              labels: {
                color: '#475569',
                font: { family: 'Inter', size: 11, weight: '600' },
                boxWidth: 12
              }
            },
            tooltip: { enabled: true },
            datalabels: {
              anchor: 'end',
              align: 'end',
              offset: 2,
              color: '#0f172a',
              font: { weight: 'bold', size: 10, family: 'Inter' },
              formatter: (value) => {
                if (value === 0) return null;
                return value;
              }
            }
          },
          layout: {
            padding: { top: 20 }
          }
        }
      });
    }
  </script>
</body>
</html>
